<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FindBenz</title>
<link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>⛽️ FindBenz</h1>
    <div id="tariff-badge" class="badge"></div>
  </header>

  <main id="screen"><div class="loading">Загрузка…</div></main>

  <nav class="tabbar">
    <button class="tab-btn active" data-screen="scan">
      <span class="tab-icon">🔍</span><span class="tab-label">Сканировать</span>
    </button>
    <button class="tab-btn" data-screen="zones">
      <span class="tab-icon">➕</span><span class="tab-label">Добавить зону</span>
    </button>
    <button class="tab-btn" data-screen="alerts">
      <span class="tab-icon">🔔</span><span class="tab-label">Оповещения</span>
    </button>
    <button class="tab-btn" data-screen="tariff">
      <span class="tab-icon">💳</span><span class="tab-label">Тариф</span>
    </button>
  </nav>
</div>
<script src="/app.js"></script>
</body>
</html>
